<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOXI AI — Solutions Industry Cards (Omnichannel Redesign)</title>
  <!-- Typography matching Image 3 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    /* ─── RESET & BASE VARIABLES ─────────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, Monaco, monospace;

      /* Source of truth colors from Image 3 */
      --bg-canvas: #F5F1EA;
      --panel-beige: #EDE8DF;
      --text-main: #14110F;
      --voxi-indigo: #3245D6;
      --voxi-indigo-dark: #2736AE;
      --bubble-grey: #EBE7DF;
      --bubble-border: rgba(20, 17, 15, 0.08);
      --green-check: #22C55E;
      --green-pill-bg: #DCFCE7;
      --green-pill-text: #15803D;
      --dark-card-start: #0E131F;
      --dark-card-end: #07090E;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: var(--font-sans);
      padding: 40px 20px 80px;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    /* ─── PAGE HEADER ────────────────────────────────────────────────────── */
    .page-header {
      max-width: 1320px;
      margin: 0 auto 36px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .page-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--voxi-indigo);
      font-weight: 600;
    }

    .page-title {
      font-size: clamp(24px, 3.5vw, 40px);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .page-sub {
      font-size: 14px;
      color: rgba(20, 17, 15, 0.6);
      max-width: 720px;
    }

    /* ─── 6 CARDS GRID ───────────────────────────────────────────────────── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 36px 32px;
      max-width: 1320px;
      margin: 0 auto;
    }

    @media (max-width: 1080px) {
      .cards-grid {
        grid-template-columns: 1fr;
        max-width: 680px;
      }
    }

    /* ─── INDUSTRY CARD CONTAINER ────────────────────────────────────────── */
    .industry-card-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .industry-label {
      font-family: var(--font-mono);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-weight: 700;
      color: var(--voxi-indigo);
      padding-left: 2px;
    }

    .card-shell {
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(20, 17, 15, 0.12);
      box-shadow: 0 10px 30px rgba(20, 17, 15, 0.08);
      display: flex;
      flex-direction: column;
      background: var(--dark-card-start);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card-shell:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(20, 17, 15, 0.12);
    }

    /* ─── TOP BEIGE PANEL WITH DOTS ──────────────────────────────────────── */
    .top-beige-panel {
      background-color: var(--panel-beige);
      background-image: radial-gradient(rgba(20, 17, 15, 0.08) 1px, transparent 1px);
      background-size: 14px 14px;
      padding: 12px 12px 0 12px;
      position: relative;
    }

    /* Inner white stage card */
    .white-stage {
      background: #FFFFFF;
      border-radius: 14px;
      border: 1px solid rgba(20, 17, 15, 0.08);
      box-shadow: 0 3px 14px rgba(20, 17, 15, 0.04);
      display: flex;
      min-height: 250px;
      position: relative;
      overflow: hidden;
    }

    @media (max-width: 600px) {
      .white-stage {
        flex-direction: column;
        min-height: auto;
      }
    }

    /* ─── LEFT AREA (5-PRODUCT OMNICHANNEL VISUAL) ────────────────────────── */
    .visual-left {
      flex: 1 1 0;
      min-width: 0;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      z-index: 2;
    }

    /* Row 1: Source & Context Bar */
    .context-bar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: #F4EFE8;
      border: 1px solid rgba(20, 17, 15, 0.1);
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(20, 17, 15, 0.68);
      width: fit-content;
      max-width: 100%;
    }

    .context-bar svg {
      width: 10px;
      height: 10px;
      opacity: 0.75;
      flex-shrink: 0;
    }

    /* Row 2: Compact 5-Channel Navigation Strip */
    .channel-strip {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .channel-strip::-webkit-scrollbar {
      display: none;
    }

    .channel-chip {
      appearance: none;
      border: 1px solid rgba(20, 17, 15, 0.1);
      background: rgba(20, 17, 15, 0.03);
      color: rgba(20, 17, 15, 0.65);
      border-radius: 6px;
      padding: 3px 7px;
      font-family: var(--font-mono);
      font-size: 8.5px;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      position: relative;
    }

    .channel-chip:hover {
      background: rgba(20, 17, 15, 0.08);
      color: var(--text-main);
    }

    .channel-chip.active {
      background: var(--voxi-indigo);
      border-color: var(--voxi-indigo);
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(50, 69, 214, 0.28);
    }

    .channel-chip .chip-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.8;
    }

    .channel-chip.active .chip-progress {
      position: absolute;
      bottom: -1px;
      left: 3px;
      right: 3px;
      height: 2px;
      background: #FFFFFF;
      border-radius: 2px;
      opacity: 0.75;
      transform-origin: left;
      animation: chipProgress 3s linear infinite;
    }

    @keyframes chipProgress {
      0% {
        transform: scaleX(0);
      }

      100% {
        transform: scaleX(1);
      }
    }

    /* Row 3: Product Visual Stage (Locked Height to Prevent Jitter) */
    .channel-viewport {
      height: 142px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .channel-pane {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .channel-pane.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    /* ─── PRODUCT PANE 1: VOICE AGENTS ───────────────────────────────────── */
    .voice-pane {
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100%;
    }

    .call-meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px;
      background: #F9F7F3;
      border-radius: 6px;
      border: 1px solid rgba(20, 17, 15, 0.06);
    }

    .call-status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-mono);
      font-size: 8.5px;
      color: #15803D;
      font-weight: 500;
    }

    .status-pulse-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #22C55E;
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2);
      animation: pulseAnim 1.6s ease-in-out infinite;
    }

    .call-duration {
      font-family: var(--font-mono);
      font-size: 8.5px;
      color: rgba(20, 17, 15, 0.5);
    }

    .waveform-strip {
      display: flex;
      align-items: center;
      gap: 2.5px;
      height: 22px;
      padding: 2px 4px;
    }

    .wave-bar {
      flex: 1;
      background: var(--voxi-indigo);
      border-radius: 2px;
      min-height: 4px;
      animation: waveDance 1.2s ease-in-out infinite alternate;
    }

    .wave-bar:nth-child(odd) {
      animation-duration: 0.9s;
      background: rgba(50, 69, 214, 0.7);
    }

    .wave-bar:nth-child(3n) {
      animation-duration: 1.3s;
    }

    .wave-bar:nth-child(4n) {
      animation-duration: 0.7s;
    }

    @keyframes waveDance {
      0% {
        height: 4px;
      }

      100% {
        height: 18px;
      }
    }

    .voice-transcript {
      background: #F8F6F2;
      border: 1px solid rgba(20, 17, 15, 0.07);
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 9.5px;
      line-height: 1.35;
    }

    .transcript-line {
      display: flex;
      gap: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .transcript-speaker {
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 600;
      color: var(--voxi-indigo);
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .transcript-speaker.user {
      color: rgba(20, 17, 15, 0.65);
    }

    .transcript-text {
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ─── PRODUCT PANE 2: WHATSAPP PLATFORM (Image 3 Source of Truth) ────── */
    .whatsapp-pane {
      display: flex;
      flex-direction: column;
      gap: 5px;
      justify-content: flex-end;
      height: 100%;
    }

    .chat-bubble-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-width: 90%;
    }

    .chat-bubble-wrap.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .chat-bubble-wrap.ai {
      align-self: flex-start;
      align-items: flex-start;
    }

    .voxi-label-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 1px;
    }

    .voxi-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--voxi-indigo);
    }

    .voxi-tag {
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--voxi-indigo);
    }

    .chat-bubble {
      padding: 4.5px 9px;
      font-size: 9.5px;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-bubble.user-bubble {
      background: var(--bubble-grey);
      color: var(--text-main);
      border-radius: 9px 9px 2px 9px;
      border: 1px solid var(--bubble-border);
    }

    .chat-bubble.ai-bubble {
      background: var(--voxi-indigo);
      color: #FFFFFF;
      border-radius: 9px 9px 9px 2px;
      box-shadow: 0 2px 6px rgba(50, 69, 214, 0.22);
    }

    /* ─── PRODUCT PANE 3: CONTACT CENTER ─────────────────────────────────── */
    .cc-pane {
      display: flex;
      flex-direction: column;
      gap: 6px;
      height: 100%;
      justify-content: center;
    }

    .cc-queue-card {
      background: #F9F7F3;
      border: 1px solid rgba(20, 17, 15, 0.08);
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .queue-title {
      font-size: 9px;
      font-weight: 600;
      color: var(--text-main);
    }

    .queue-badge {
      font-family: var(--font-mono);
      font-size: 8px;
      background: rgba(50, 69, 214, 0.1);
      color: var(--voxi-indigo);
      padding: 1.5px 5px;
      border-radius: 4px;
      font-weight: 600;
    }

    .routing-flow {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 8px;
      background: #FFFFFF;
      border: 1px dashed rgba(20, 17, 15, 0.15);
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 8.5px;
      color: rgba(20, 17, 15, 0.7);
    }

    .routing-node {
      font-weight: 600;
      color: var(--text-main);
    }

    .routing-node.active-dest {
      color: var(--voxi-indigo);
      background: rgba(50, 69, 214, 0.08);
      padding: 1px 4px;
      border-radius: 3px;
    }

    .cc-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 8px;
      color: rgba(20, 17, 15, 0.55);
      padding: 0 2px;
    }

    /* ─── PRODUCT PANE 4: QUALITY MANAGEMENT ─────────────────────────────── */
    .qa-pane {
      display: flex;
      flex-direction: column;
      gap: 6px;
      height: 100%;
      justify-content: center;
    }

    .scorecard-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #F9F7F3;
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid rgba(20, 17, 15, 0.07);
    }

    .score-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 10px;
      color: var(--voxi-indigo);
    }

    .score-grade {
      background: var(--voxi-indigo);
      color: #FFF;
      font-size: 7.5px;
      padding: 1px 4px;
      border-radius: 3px;
    }

    .scorecard-chips {
      display: flex;
      gap: 4px;
    }

    .metric-pill {
      flex: 1;
      padding: 4px 6px;
      border-radius: 5px;
      font-size: 8px;
      font-family: var(--font-mono);
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .metric-pill.green {
      background: rgba(34, 197, 94, 0.12);
      color: #15803D;
      border: 1px solid rgba(34, 197, 94, 0.25);
    }

    .metric-pill.blue {
      background: rgba(50, 69, 214, 0.1);
      color: var(--voxi-indigo);
      border: 1px solid rgba(50, 69, 214, 0.22);
    }

    .qa-flag-box {
      background: #FFFFFF;
      border: 1px solid rgba(20, 17, 15, 0.08);
      border-left: 2.5px solid #22C55E;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 8.5px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .flag-icon {
      font-size: 9px;
      flex-shrink: 0;
    }

    /* ─── PRODUCT PANE 5: CUSTOMER ENGAGEMENT ────────────────────────────── */
    .engage-pane {
      display: flex;
      flex-direction: column;
      gap: 4px;
      height: 100%;
      justify-content: center;
    }

    .timeline-title {
      font-family: var(--font-mono);
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: rgba(20, 17, 15, 0.55);
      margin-bottom: 2px;
    }

    .timeline-track {
      display: flex;
      flex-direction: column;
      gap: 4.5px;
      position: relative;
      padding-left: 12px;
    }

    .timeline-track::before {
      content: '';
      position: absolute;
      left: 4.5px;
      top: 4px;
      bottom: 4px;
      width: 1px;
      background: rgba(20, 17, 15, 0.15);
    }

    .timeline-node {
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
      font-size: 8.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .timeline-node::before {
      content: '';
      position: absolute;
      left: -12px;
      top: 50%;
      transform: translateY(-50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 1.5px solid var(--voxi-indigo);
    }

    .timeline-node.done::before {
      background: #22C55E;
      border-color: #22C55E;
    }

    .timeline-badge {
      font-family: var(--font-mono);
      font-size: 7.5px;
      font-weight: 600;
      padding: 1px 4px;
      border-radius: 3px;
      background: #F1ECE3;
      color: rgba(20, 17, 15, 0.7);
      flex-shrink: 0;
    }

    .timeline-desc {
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ─── VERTICAL DIVIDER ───────────────────────────────────────────────── */
    .panel-divider {
      width: 1px;
      background: rgba(20, 17, 15, 0.08);
      align-self: stretch;
      flex-shrink: 0;
    }

    @media (max-width: 600px) {
      .panel-divider {
        width: 100%;
        height: 1px;
      }
    }

    /* ─── RIGHT ACTIONS PANEL (Image 3 Source of Truth) ──────────────────── */
    .actions-right {
      width: 148px;
      padding: 12px 10px 10px;
      display: flex;
      flex-direction: column;
      position: relative;
      flex-shrink: 0;
      overflow: hidden;
    }

    @media (max-width: 600px) {
      .actions-right {
        width: 100%;
        padding: 10px 14px 14px;
      }
    }

    /* Faint building watermark behind actions */
    .actions-watermark {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 105px;
      height: 130px;
      opacity: 0.055;
      pointer-events: none;
      z-index: 1;
    }

    /* Top green replied pill */
    .replied-pill-wrap {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 6px;
      position: relative;
      z-index: 2;
    }

    .replied-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2.5px 7px;
      background: var(--green-pill-bg);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 8.5px;
      color: var(--green-pill-text);
      font-weight: 500;
      white-space: nowrap;
    }

    .replied-dot {
      width: 4.5px;
      height: 4.5px;
      border-radius: 50%;
      background: #22C55E;
      animation: pulseAnim 1.8s ease-in-out infinite;
    }

    @keyframes pulseAnim {

      0%,
      100% {
        opacity: 0.4;
      }

      50% {
        opacity: 1;
      }
    }

    .actions-label {
      font-family: var(--font-mono);
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: rgba(20, 17, 15, 0.45);
      margin-bottom: 5px;
      position: relative;
      z-index: 2;
    }

    /* Checklist */
    .checklist-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 6px;
      position: relative;
      z-index: 2;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0.24;
      transform: translateX(-2px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .check-row.checked {
      opacity: 1;
      transform: translateX(0);
    }

    .check-circle {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 1.5px solid rgba(20, 17, 15, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .check-row.checked .check-circle {
      background-color: var(--green-check);
      border-color: var(--green-check);
    }

    .check-circle svg {
      width: 7px;
      height: 7px;
      stroke: #FFFFFF;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: none;
    }

    .check-row.checked .check-circle svg {
      display: block;
    }

    .check-text {
      font-size: 9.5px;
      font-weight: 500;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Blue confirmation pill */
    .outcome-pill {
      margin-top: auto;
      padding: 5px 8px;
      background: var(--voxi-indigo);
      border-radius: 7px;
      color: #FFFFFF;
      font-size: 9px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 3px 10px rgba(50, 69, 214, 0.28);
      position: relative;
      z-index: 2;
      opacity: 0.15;
      transform: translateY(2px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .outcome-pill.visible {

    /**
     * CARD CONTROLLER ENGINE
     * Manages:
     * 1. 3s auto-cycle across 5 channels
     * 2. Hover pause / resume
     * 3. Direct chip click jumping
     * 4. Synced progressive checklist ticking
     * 5. prefers-reduced-motion static final state
     */
    function initCardController(cardElement, industryData) {
      const chips = cardElement.querySelectorAll('.channel-chip');
      const panes = cardElement.querySelectorAll('.channel-pane');
      const actionRows = cardElement.querySelectorAll('.check-row');
      const outcomePill = cardElement.querySelector('.outcome-pill');

      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // In reduced motion mode, show final state statically
      if (prefersReduced) {
        chips.forEach(c => c.classList.remove('active'));
        if (chips[4]) chips[4].classList.add('active');
        panes.forEach(p => p.classList.remove('active'));
        const lastPane = cardElement.querySelector(`.channel-pane[data-pane="${chips[4].dataset.channel}"]`);
        if (lastPane) lastPane.classList.add('active');
        actionRows.forEach(r => r.classList.add('checked'));
        outcomePill.classList.add('visible');
        return;
      }

      let activeChannelIndex = 0;
      let timer = null;
      let isPaused = false;
      const CYCLE_DURATION = 3000; // 3 seconds per channel

      function setChannel(index) {
        activeChannelIndex = (index + 5) % 5;

        // 1. Update Chips
        chips.forEach((chip, i) => {
          if (i === activeChannelIndex) {
            chip.classList.add('active');
            // Reset chip progress animation
            const progress = chip.querySelector('.chip-progress');
            if (progress) {
              progress.style.animation = 'none';
              void progress.offsetWidth; // trigger reflow
              progress.style.animation = `chipProgress ${CYCLE_DURATION}ms linear infinite`;
            }
          } else {
            chip.classList.remove('active');
          }
        });

        // 2. Swap Content Panes
        const targetChannelKey = chips[activeChannelIndex].dataset.channel;
        panes.forEach(pane => {
          if (pane.dataset.pane === targetChannelKey) {
            pane.classList.add('active');
          } else {
            pane.classList.remove('active');
          }
        });

        // 3. Sync Action Checklist (Story advances in lockstep)
        // Step 0: 1 item, Step 1: 2 items, Step 2: 3 items, Step 3: 4 items, Step 4: all 5 items + outcome pill
        actionRows.forEach((row, i) => {
          if (i <= activeChannelIndex) {
            row.classList.add('checked');
          } else {
            row.classList.remove('checked');
          }
        });

        // Final Outcome Pill visible on 5th channel (Engage)
        if (activeChannelIndex === 4) {
          outcomePill.classList.add('visible');
        } else {
          outcomePill.classList.remove('visible');
        }
      }

      function startCycle() {
        clearTimeout(timer);
        if (isPaused) return;
        timer = setTimeout(() => {
          setChannel(activeChannelIndex + 1);
          startCycle();
        }, CYCLE_DURATION);
      }

      // Chip Click Handler
      chips.forEach((chip, idx) => {
        chip.addEventListener('click', (e) => {
          e.preventDefault();
          setChannel(idx);
          clearTimeout(timer);
          startCycle();
        });
      });

      // Hover Pause / Resume on White Stage
      const stage = cardElement.querySelector('.white-stage');
      stage.addEventListener('mouseenter', () => {
        isPaused = true;
        clearTimeout(timer);
        const activeProgress = cardElement.querySelector('.channel-chip.active .chip-progress');
        if (activeProgress) activeProgress.style.animationPlayState = 'paused';
      });

      stage.addEventListener('mouseleave', () => {
        isPaused = false;
        const activeProgress = cardElement.querySelector('.channel-chip.active .chip-progress');
        if (activeProgress) activeProgress.style.animationPlayState = 'running';
        startCycle();
      });

      // Initial Start
      setChannel(0);
      startCycle();
    }

    // Initialize on DOM load
    document.addEventListener('DOMContentLoaded', renderIndustryCards);
  </script>
